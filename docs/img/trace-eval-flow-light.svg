<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="t d"><title id="t">llm-trace-eval flow</title><desc id="d">Each of 50 examples becomes an llm.call span, is scored by normalised exact match, and written to results.json and traces.jsonl.</desc><rect width="880" height="350" rx="14" fill="#F4F1E6"/><text x="40" y="44" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22"  fill="#4F5642" letter-spacing="1">failed calls become ERROR spans, the run continues</text><line x1="40" y1="60" x2="840" y2="60" stroke="#4F5642" stroke-width="2"/><line x1="40" y1="60" x2="40" y2="72" stroke="#4F5642" stroke-width="2"/><line x1="840" y1="60" x2="840" y2="72" stroke="#4F5642" stroke-width="2"/><rect x="40.0" y="92" width="170" height="170" rx="12" fill="none" stroke="#B9B49C" stroke-width="2"/><text x="125.0" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#232B17" >1 prompt</text><rect x="75.0" y="166" width="100" height="60" rx="10" fill="none" stroke="#232B17" stroke-width="2.5"/><line x1="91.0" y1="184" x2="159.0" y2="184" stroke="#B9B49C" stroke-width="3" stroke-linecap="round"/><line x1="91.0" y1="200" x2="145.0" y2="200" stroke="#B9B49C" stroke-width="3" stroke-linecap="round"/><line x1="91.0" y1="216" x2="131.0" y2="216" stroke="#B9B49C" stroke-width="3" stroke-linecap="round"/><text x="125.0" y="296" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22"  fill="#4F5642" >50 examples,</text><text x="125.0" y="324" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22"  fill="#4F5642" >known answers</text><line x1="218.0" y1="177" x2="240.0" y2="177" stroke="#4F5642" stroke-width="2.5" stroke-linecap="round"/><path d="M232.0 170 L242.0 177 L232.0 184" fill="none" stroke="#4F5642" stroke-width="2.5" stroke-linecap=